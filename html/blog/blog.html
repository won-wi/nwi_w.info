<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>네이버 블로그</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="../../prevent.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #fff;
            color: #111;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
        }

        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
            height: 100%;
            margin: 0 auto;
            padding-bottom: 30px;
            background: #fff;
            position: relative;
        }

        /* ---------- 헤더 ---------- */
        .header {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-n {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #000;
            color: #fff;
            font-family: 'Raleway', sans-serif;
            font-weight: 800;
            font-size: 15px;
        }

        .logo-text {
            font-family: 'Raleway', sans-serif;
            font-weight: 700;
            font-size: 25px;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 20px;
        }

        /* ---------- 상단 탭 ---------- */
        .tabs {
            flex: none;
            display: flex;
            gap: 32px;
            padding: 0 20px;
            overflow-x: auto;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
            justify-content: space-between;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            position: relative;
            flex: none;
            padding: 14px 0 12px;
            font-size: 15px;
            font-weight: 400;
            line-height: 21px;
            letter-spacing: -0.2px;
            color: #111;
        }

        .tab.active {
            font-weight: 700;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 2px;
            background: #000;
        }

        /* ---------- 본문 영역 ---------- */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        .view {
            display: none;
            min-height: 100%;
            padding-bottom: 40px;
        }

        .view.active {
            display: block;
        }

        .empty-text {
            padding-top: 120px;
            text-align: center;
            font-size: 14px;
            color: #999;
        }

        /* ---------- 1. 홈 ---------- */
        .home-cards {
            display: flex;
            gap: 8px;
            margin-top: 33px;
            padding: 0 14px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-padding-left: 14px;
            scrollbar-width: none;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        .home-cards::-webkit-scrollbar {
            display: none;
        }

        .home-cards.dragging {
            scroll-snap-type: none;
            cursor: grabbing;
        }

        .home-card {
            position: relative;
            flex: 0 0 calc(100% - 71px);
            overflow: hidden;
            background: #fff;
            scroll-snap-align: start;
        }

        .home-card-img {
            aspect-ratio: 3 / 4;
            background: #c2c2c2;
            border: 1px solid #e2e1e1;
            border-radius: 18px;
            overflow: hidden;
        }

        .home-card-img img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
        }

        .home-card-text {
            color: #111;
        }

        .home-card-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.3px;
            padding-top: 10px;
            padding-left: 10px;
        }

        .home-card-snippet {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.5;
            color: #555;
            padding-left: 10px;
        }

        .home-card-author {
            margin-top: 12px;
            font-size: 12px;
            color: #888;
            padding-left: 10px;
        }

        .home-empty {
            flex: 1;
            padding: 80px 0;
            text-align: center;
            font-size: 14px;
            color: #999;
        }

        /* ---------- 2. 탐색 ---------- */
        .chips {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex: none;
            padding: 7px 10px;
            border: 1px solid #e4e5e8;
            border-radius: 15px;
            background: #f8f9fa;
            font-size: 13px;
            font-weight: 500;
            color: #222;
        }

        .chip.active {
            border-color: #1b1b1b;
            background: #1b1b1b;
            color: #fff;
        }

        .chip-gear {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 39px;
            height: 39px;
            border: 1px solid #e4e5e8;
            border-radius: 50%;
            background: #f8f9fa;
            font-size: 16px;
        }

        .feed-info {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 20px;
        }

        .feed-text {
            flex: 1;
            min-width: 0;
        }

        .feed-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 15px;
            font-weight: 700;
            line-height: 21px;
            letter-spacing: -0.4px;
        }

        .feed-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 12.5px;
            line-height: 20px;
            color: #888;
        }

        .feed-meta i {
            margin-left: 6px;
            font-size: 15px;
        }

        .feed-meta i:first-of-type {
            margin-left: 4px;
        }

        .feed-author {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 6px;
            font-size: 12px;
            color: #333;
        }

        .avatar-sm {
            width: 22px;
            height: 22px;
            overflow: hidden;
            border-radius: 50%;
            background: #ddd;
        }

        .avatar-sm img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feed-thumb {
            position: relative;
            flex: none;
            width: 90px;
            height: 90px;
            overflow: hidden;
            border-radius: 12px;
            background: #ffffff;
        }

        .feed-thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .feed-thumb i {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #fff;
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5));
        }

        /* ---------- 3. 이웃목록 ---------- */
        .segment {
            display: flex;
            margin: 20px 16px 0;
            height: 38px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            background: #f6f7f9;
        }

        .segment button {
            flex: 1;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #999;
        }

        .segment button.active {
            margin: -1px;
            border: 1px solid #ddd;
            background: #fff;
            font-weight: 700;
            color: #111;
        }

        .neighbor-search {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 13px 16px 0;
            height: 38px;
            padding: 0 16px;
            border-radius: 10px;
            background: #f0f1f3;
            color: #999;
        }

        .neighbor-search i {
            font-size: 16px;
        }

        .neighbor-search input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: #111;
        }

        .neighbor-search input::placeholder {
            color: #999;
        }

        .neighbor-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 13px 16px 0;
        }

        .neighbor-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }

        .btn-group {
            height: 25px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 11px;
            color: #555;
        }

        .neighbor-sort {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: #555;
        }

        .neighbor-sort i {
            font-size: 10px;
            color: #888;
        }

        .neighbor-list {
            margin-top: 14px;
        }

        .neighbor-item {
            display: flex;
            align-items: center;
            height: 62px;
            padding: 0 10px 0 16px;
        }

        .neighbor-avatar {
            flex: none;
            width: 50px;
            height: 50px;
            overflow: hidden;
            border-radius: 50%;
            background: #c2c2c2;
        }

        .neighbor-avatar img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .neighbor-name {
            flex: 1;
            min-width: 0;
            margin-left: 12px;
        }

        .neighbor-name b {
            display: block;
            font-size: 13px;
            font-weight: 700;
        }

        .neighbor-name span {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: #999;
        }

        .btn-neighbor {
            flex: none;
            width: 82px;
            height: 34px;
            margin-right: 6px;
            border-radius: 10px;
            background: #eee;
            font-size: 12.5px;
            color: #111;
        }

        .btn-more {
            flex: none;
            width: 20px;
            font-size: 14px;
            color: #999;
        }

        /* ---------- 이웃 팝업 (index.html 알림창 방식) ---------- */
        .popup-mask {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 400px;
            margin: 0 auto;
            overflow: hidden;
            pointer-events: none;
            z-index: 40;
        }

        .popup-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            position: absolute;
            top: 60px;
            right: 15px;
            width: 280px;
            padding: 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            pointer-events: auto;
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .popup.active {
            transform: translateX(0);
        }

        .popup-tile {
            padding: 12px 16px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.85);
        }

        .popup-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .popup-name {
            font-size: 14px;
            font-weight: 700;
            color: #000;
        }

        .btn-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin: -4px -8px 0 0;
            border-radius: 50%;
            font-size: 13px;
            color: #555;
        }

        .btn-copy.done {
            color: #03c75a;
        }

        .popup-text {
            font-size: 13px;
            line-height: 1.55;
            color: #333;
            white-space: pre-wrap;
            word-break: keep-all;
        }

        /* ---------- 글 상세 (iframe) ---------- */
        .post-frame {
            display: none;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100%;
            margin: 0 auto;
            border: none;
            background: #fff;
            z-index: 50;
        }

        .post-frame.open {
            display: block;
        }

        /* ===================================================================
            하단 브라우저 바 (N 로고만 기능, 나머지는 디자인 요소)
        ===================================================================  */
        .browser-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            height: 60px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            align-items: start;
            padding: 0 3px;
            background: #ffffff;
            border-top: 0.67px solid #d9d9d9;
            z-index: 15;
            -webkit-tap-highlight-color: transparent;
        }

        .browser-btn {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e2e2e;
        }

        .browser-btn svg {
            display: block;
            overflow: visible;
        }

        .browser-btn.disabled {
            color: #cccccc;
        }

        .browser-home {
            cursor: pointer;
        }
    </style>
</head>

    <main class="content" id="content">

    <!-- 하단 브라우저 바  -->
    <div class="browser-bar">

            <svg width="23.3" height="23.3" viewBox="0 0 23.3 23.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="1" width="21.3" height="21.3" rx="4.5"/>
                <path d="M7.6 15.7V7.7L15.7 15.7V7.7"/>
            </svg>
        </div>
        <div class="browser-btn">
            <svg width="10.3" height="17.7" viewBox="0 0 10.3 17.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.3 1L1 8.85L9.3 16.7"/>
            </svg>
        </div>
        <div class="browser-btn disabled">
            <svg width="10.3" height="17.7" viewBox="0 0 10.3 17.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1L9.3 8.85L1 16.7"/>
            </svg>
        </div>
        <div class="browser-btn">
            <svg width="19.6" height="20.5" viewBox="0 0 19.6 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9.13" cy="9.3" r="8"/>
                <path d="M14.8 15.2L18.5 19.4"/>
            </svg>
        </div>
        <div class="browser-btn">
            <svg width="20" height="19.5" viewBox="0 0 20 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.33 11.93A8.58 8.58 0 1 1 18.4 7.17M18.4 1.67V7.17H13.67"/>
            </svg>
        </div>
        <div class="browser-btn">
            <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1H21M1 9H21"/>
            </svg>
        </div>
    </div>

    <div class="popup-mask">
        <div class="popup-overlay" id="popupOverlay"></div>
        <div class="popup" id="popup">
            <div class="popup-tile">
                <div class="popup-head">
                    <span class="popup-name" id="popupName"></span>
                    <button class="btn-copy" id="copyBtn" aria-label="복사"><i class="fa-regular fa-copy"></i></button>
                </div>
                <p class="popup-text" id="popupText"></p>
            </div>
        </div>
    </div>

    <iframe id="blogPost" class="post-frame"></iframe>

</div>

    /* =========================================================

    const tabsEl = document.getElementById('tabs');
    const contentEl = document.getElementById('content');

    function renderTabs() {
        tabsEl.innerHTML = tabs.map(t =>
            `<button class="tab" data-tab="${t.id}">${t.name}</button>`
        ).join('');
    }

    function showTab(id) {
        tabsEl.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === id));
        document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + id));
        contentEl.scrollTop = 0;
    }

    tabsEl.addEventListener('click', e => {
        const btn = e.target.closest('.tab');
        if (btn) showTab(btn.dataset.tab);
    });

    const homeCardsEl = document.getElementById('homeCards');

    function renderHome() {
        if (!myContents.length) {
            homeCardsEl.innerHTML = '<div class="home-empty">저장된 내용이 없습니다</div>';
            return;
        }

        homeCardsEl.innerHTML = myContents.map(p => `
            <${p.href ? `a href="${p.href}" target="blogPost"` : 'div'} class="home-card" draggable="false">
                <div class="home-card-img">${p.image ? `<img src="${p.image}" alt="" draggable="false">` : ''}</div>
                <div class="home-card-text">
                    ${p.title ? `<div class="home-card-title">${p.title}</div>` : ''}
                    ${p.snippet ? `<div class="home-card-snippet">${p.snippet}</div>` : ''}
                    ${p.author ? `<div class="home-card-author">${p.author}</div>` : ''}
                </div>
            </${p.href ? 'a' : 'div'}>
        `).join('');

        homeCardsEl.scrollLeft = 0;
    }

    /* 마우스 드래그로 카드 넘기기 (터치는 기본 스크롤) */
    let cardDown = false;
    let cardMoved = false;
    let cardStartX = 0;
    let cardStartScroll = 0;

    homeCardsEl.addEventListener('mousedown', e => {
        cardDown = true;
        cardMoved = false;
        cardStartX = e.pageX;
        cardStartScroll = homeCardsEl.scrollLeft;
        homeCardsEl.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
        if (!cardDown) return;
        const diff = e.pageX - cardStartX;
        if (Math.abs(diff) > 5) cardMoved = true;
        homeCardsEl.scrollLeft = cardStartScroll - diff;
    });

    window.addEventListener('mouseup', () => {
        if (!cardDown) return;
        cardDown = false;
        homeCardsEl.classList.remove('dragging');
    });

    /* 홈 두 번째 카드 영역 (디자인·동작은 첫 번째 영역과 동일) */

        if (!myContents2.length) {
            homeCardsEl2.innerHTML = '<div class="home-empty">저장된 내용이 없습니다</div>';
            return;
        }

        homeCardsEl2.innerHTML = myContents2.map(p => `
            <${p.href ? `a href="${p.href}" target="blogPost"` : 'div'} class="home-card" draggable="false">
                <div class="home-card-img">${p.image ? `<img src="${p.image}" alt="" draggable="false">` : ''}</div>

                </div>
            </${p.href ? 'a' : 'div'}>
        `).join('');

        homeCardsEl2.scrollLeft = 0;
    }

    let cardDown2 = false;
    let cardStartX2 = 0;
    let cardStartScroll2 = 0;

    homeCardsEl2.addEventListener('mousedown', e => {
        cardDown2 = true;
        cardStartX2 = e.pageX;
        cardStartScroll2 = homeCardsEl2.scrollLeft;
        homeCardsEl2.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
        if (!cardDown2) return;
        homeCardsEl2.scrollLeft = cardStartScroll2 - (e.pageX - cardStartX2);
    });

    window.addEventListener('mouseup', () => {
        if (!cardDown2) return;
        cardDown2 = false;
        homeCardsEl2.classList.remove('dragging');

       탐색

    const chipsEl = document.getElementById('chips');
    const feedEl = document.getElementById('feed');
    let exploreCategory = 'pin';

    function renderChips() {
        const chipHtml = c =>
            `<button class="chip ${c.id === exploreCategory ? 'active' : ''}" data-cat="${c.id}">${c.name}</button>`;

        chipsEl.innerHTML =
            chipHtml(categories[0]) +
            `<div class="chip-gear"><i class="fa-solid fa-gear"></i></div>` +
            categories.slice(1).map(chipHtml).join('');
    }

    function renderFeed() {
        const list = posts.filter(p => exploreCategory === 'all' || p.category === exploreCategory);

        feedEl.innerHTML = list.map(p => `
            <article class="feed-item">

                        <a href="${p.href}" target="blogPost">
                            <div class="feed-title">${p.title}</div>

                    </a>
                </div>
            </article>
        `).join('');
    }

    chipsEl.addEventListener('click', e => {

    const popupEl = document.getElementById('popup');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupName = document.getElementById('popupName');
    const popupText = document.getElementById('popupText');
    const copyBtn = document.getElementById('copyBtn');
    let copyTimer = null;

    function openPopup(neighbor) {
        popupName.textContent = neighbor.name;
        popupText.textContent = neighbor.message;
        setCopyIcon(false);
        popupEl.classList.add('active');
        popupOverlay.classList.add('active');
    }

    function closePopup() {
        popupEl.classList.remove('active');
        popupOverlay.classList.remove('active');
    }

    function setCopyIcon(done) {
        copyBtn.classList.toggle('done', done);
        copyBtn.innerHTML = done
            ? '<i class="fa-solid fa-check"></i>'
            : '<i class="fa-regular fa-copy"></i>';
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (err) {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            area.remove();
        }
    }

    neighborListEl.addEventListener('click', e => {
        const btn = e.target.closest('.btn-neighbor');
        if (!btn) return;
        const neighbor = neighborLists[neighborTab].find(n => n.name === btn.dataset.name);
        if (neighbor) openPopup(neighbor);
    });

    popupOverlay.addEventListener('click', closePopup);

    copyBtn.addEventListener('click', async () => {
        await copyText(popupText.textContent);
        setCopyIcon(true);
        clearTimeout(copyTimer);
        copyTimer = setTimeout(() => setCopyIcon(false), 1200);
    });

    /* =========================================================
       글 상세 열기 / 닫기 (index.html 의 iframe 방식과 동일)
       ========================================================= */
    const postFrame = document.getElementById('blogPost');

    document.addEventListener('click', e => {
        const link = e.target.closest('a');
        if (!link) return;

        const href = link.getAttribute('href');
        if (!href || !href.endsWith('.html')) return;

        e.preventDefault();

        if (cardMoved) {
            cardMoved = false;
            return;
        }

        postFrame.src = href;
        postFrame.classList.add('open');
    });

    window.addEventListener('message', e => {
        if (!e.data) return;

        if (e.data.type === 'closeAll' && e.source === postFrame.contentWindow) {
            postFrame.classList.remove('open');
            if (window.parent !== window) window.parent.postMessage({ type: 'closeApp' }, '*');
            return;
        }

        if (e.data.type !== 'closeApp') return;
        if (e.source === postFrame.contentWindow) postFrame.classList.remove('open');
    });

    /* 뒤로 버튼 */
    document.getElementById("naverHomeBtn").addEventListener("click", function () {
        if (window.parent !== window) {
            try {
                if (window.frameElement) {
                    window.frameElement.classList.remove("open");
                    return;
                }
            } catch (err) { /* 접근할 수 없으면 아래 방식 사용 */ }
            window.parent.postMessage({ type: "closeApp" }, "*");
            return;
        }
        // 단독으로 열린 경우: index.html로 이동
