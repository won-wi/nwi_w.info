<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인스타그램</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Gowun+Dodum&family=Poor+Story&display=swap" rel="stylesheet">
    <script src="../prevent.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Gowun Dodum", sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #ffffff;
            overflow: hidden;
            padding-bottom: 30px;
        }

        .instagram-app {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            margin: 0 auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* ===================================================================
            로딩 화면 디자인
        ===================================================================  */
        .instagram-loading {
            position: absolute;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
        }

        .instagram-loading i {
            font-size: 42px;
            color: #000000;
        }

        .instagram-loading.hidden {
            display: none;
        }

        .screen {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .topbar {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 19px;
            font-weight: 600;
        }

        .top-actions {
            display: flex;
            gap: 20px;
            font-size: 21px;
        }

        .stories {
            display: flex;
            flex-wrap: nowrap;
            gap: 14px;
            padding: 12px;
            overflow-x: auto;
            border-bottom: 1px solid #eeeeee;
            scrollbar-width: none;
        }

        .stories::-webkit-scrollbar {
            display: none;
        }

        .story {
            width: 64px;
            min-width: 64px;
            text-align: center;
            font-size: 10px;
        }

        .story-ring {
            width: 70px;
            height: 70px;
            padding: 2px;
            margin: 0 auto 4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .post {
            border-bottom: 1px solid #eeeeee;
        }

        .post-header {
            height: 48px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 12px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 50%;
            cursor: pointer;
        }

        .username {
            font-size: 13px;
            font-weight: 600;
        }

        .post-image {
            width: 90vw;
            max-height: calc(100vh - 200px);
            object-fit: contain;
            display: block;
            margin: 0 auto;
            -webkit-user-drag: none;
            user-select: none;
            display: block;
        }

        .post-media {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .post-track {
            width: 100%;
            display: flex;
            touch-action: pan-y;
        }

        .post-slide {
            min-width: 100%;
            flex-shrink: 0;
        }

        .post-counter {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 4px 10px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            font-size: 12px;
            pointer-events: none;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 17px;
            padding: 9px 12px 5px;
            font-size: 21px;
        }

        .post-actions .save {
            margin-left: auto;
        }

        .post-meta {
            padding: 0 12px 12px;
            font-size: 12px;
            line-height: 1.5;
        }

        .like-button {
            cursor: pointer;
        }

        .profile {
            display: none;
        }

        .profile-head {
            padding: 18px 14px 12px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            cursor: pointer;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .profile-name-arrow {
            font-size: 10px;
            font-weight: 900;
            margin-left: 6px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-between;
            text-align: center;
            padding: 0 8%;
        }

        .profile-stats strong {
            display: block;
            font-size: 15px;
        }

        .profile-stats span {
            font-size: 11px;
        }

        .profile-bio {
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.5;
        }

        .profile-actions {
            display: flex;
            gap: 5px;
            margin-top: 12px;
        }

        .profile-actions button {
            flex: 1;
            height: 32px;
            border: 0;
            border-radius: 7px;
            background: #efefef;
            font-size: 12px;
            cursor: pointer;
        }

        .profile-tabs {
            height: 46px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid #eeeeee;
            border-bottom: 1px solid #dddddd;
        }

        .profile-tabs div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .profile-tabs .active {
            border-bottom: 2px solid #000000;
        }

        .profile-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            overflow-x: hidden;
        }

        .profile-grid-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            object-fit: cover;
            cursor: pointer;
        }

        .account-sheet {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            align-items: flex-start;
            justify-content: center;
            background: transparent;
            z-index: 20;
        }

        /* ===================================================================
           계정 전환 탭
        ===================================================================  */
        .account-panel {
            width: min(430px, 100%);
            margin-top: 0;
            padding: 10px 0 12px;
            background: #ffffff;
            border-radius: 0 0 16px 16px;
            border-bottom: 1.5px solid #eeeeee;
        }

        .account-title {
            padding: 8px 18px 12px;
            color: #777777;
            font-size: 13px;
        }

        .account-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .account-option:hover {
            background: #f5f5f5;
        }

        .account-option img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
        }

        .account-option-name {
            font-size: 14px;
            font-weight: 600;
        }

        .check {
            margin-left: auto;
            font-size: 15px;
        }

        .viewer {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            background: #ffffff;
            z-index: 30;
            overflow: hidden;
            padding-bottom: 10px;
        }

        .viewer-header {
            height: 52px;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 14px;
            border-bottom: 1px solid #eeeeee;
        }

        .viewer-header i {
            font-size: 20px;
            cursor: pointer;
        }

        .viewer-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
        }

        .viewer-body::-webkit-scrollbar {
            display: none;
        }

        .viewer-media {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .viewer-track {
            width: 100%;
            display: flex;
            touch-action: pan-y;
        }

        .viewer-slide {
            min-width: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        .viewer-slide img {
            width: 90vw;
            height: auto;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            object-fit: contain;
            display: block;
            margin: 0 auto;
            -webkit-user-drag: none;
            user-select: none;
        }

        .viewer-counter {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 4px 10px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            font-size: 12px;
            pointer-events: none;
        }

        .viewer-actions {
            height: 48px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 12px;
            font-size: 21px;
        }

        .viewer-actions .save {
            margin-left: auto;
        }

        .viewer-caption {
            padding: 0 12px 20px;
            font-size: 13px;
        }

        .viewer-date {
            font-size: 12px;
            color: #7a7a7a;
        }

        .bottom-nav {
            height: 62px;
            min-height: 62px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            align-items: center;
            background: #ffffff;
            border-top: 1px solid #eeeeee;
            z-index: 10;
        }

        .nav-button {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
        }

        .nav-button i {
            pointer-events: none;
        }

        .profile-nav-button img {
            width: 27px;
            height: 27px;
            object-fit: cover;
            border-radius: 50%;
        }

        .notification-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            right: calc(50% - 17px);
            top: 34px;
            border-radius: 50%;
            background: #ed4956;
        }

        .nav-button.active {
            font-weight: 700;
        }

        .story-viewer {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            background: #000000;
            z-index: 50;
        }

        .story-progress-container {
            position: absolute;
            top: 30px;
            left: 12px;
            right: 12px;
            height: 2px;
            display: flex;
            gap: 4px;
            z-index: 52;
        }

        .story-progress-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .story-progress-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 2px;
        }

        .story-header {
            position: absolute;
            top: 35px;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            z-index: 51;
        }

        .story-header .username {
            color: #ffffff;
        }

        .story-header i {
            color: #ffffff;
            font-size: 24px;
            margin-left: auto;
            cursor: pointer;
        }

        .story-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }

        .story-overlay {
            position: absolute;
            display: none;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
        }

        .story-overlay-item {
            position: absolute;
            margin: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        .story-overlay-text {
            white-space: pre-wrap;
        }

        .story-overlay-image {
            display: block;
        }

        .story-footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            height: 60px;
            background: transparent;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 52;
        }

        .story-input-container {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 22px;
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            overflow: hidden;
        }

        .story-input {
            background: transparent;
            border: none;
            color: #ffffff;
            outline: none;
            font-size: 16px;
            transform: scale(0.8125);
            transform-origin: left center;
            width: 123%;
        }

        .story-input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }

        .story-chat-area {
            position: absolute;
            bottom: 95px;
            left: 16px;
            right: 16px;
            z-index: 52;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
            pointer-events: none;
        }

        .story-bubble {
            background: #ffffff;
            color: #000000;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: fit-content;
            max-width: 250px;
            word-wrap: break-word;
            animation: popIn 0.2s ease-out;
        }

        .story-bubble-sender {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .story-bubble-sender img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .story-bubble-sender span {
            font-size: 12px;
            font-weight: 600;
        }

        .story-bubble-message {
            font-size: 13px;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        button {
            color: #000000;
        }

        /* ===================================================================
            하단 브라우저 바 (N 로고만 기능, 나머지는 디자인 요소)
        ===================================================================  */
        .browser-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            height: 60px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            align-items: start;
            padding: 0 3px;
            background: #ffffff;
            border-top: 0.67px solid #d9d9d9;
            z-index: 15;
            -webkit-tap-highlight-color: transparent;
        }

        .browser-btn {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e2e2e;
        }

        .browser-btn svg {
            display: block;
            overflow: visible;
        }

        .browser-btn.disabled {
            color: #cccccc;
        }

        .browser-home {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="instagram-app">
    
    <!-- 이미지 로딩 화면 -->
    <div id="instagramLoading" class="instagram-loading">
        <i class="fa-brands fa-instagram" aria-hidden="true"></i>
    </div>

    <main id="homeScreen" class="screen home-feed">
        <div class="topbar">
            <div class="brand">
                <img src="../img/instagram.png" style="width: 25px;">
                Instagram
            </div>
            <div class="top-actions">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-regular fa-paper-plane"></i>
            </div>
        </div>

        <div id="stories" class="stories"></div>

        <div id="homePosts"></div>
    </main>

    <main id="profileScreen" class="screen profile">
        <div class="topbar">
            <div id="profileTopbarAccount" class="brand" style="cursor: pointer; display: flex; align-items: center;">
                <span id="profileTopbarAccountText"></span>
                <span class="profile-name-arrow">∨</span>
            </div>

            <div class="top-actions">
                <i class="fa-regular fa-square-plus"></i>
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>

        <section class="profile-head">
            <div class="profile-top">
                <img id="profileAvatar" class="profile-avatar" alt="프로필 이미지">
                <div class="profile-info">
                    <div id="profileName" class="profile-name">
                        <span id="profileNameText"></span>
                    </div>
                    <div class="profile-stats">
                        <div>
                            <strong id="postCount">0</strong>
                            <span>게시물</span>
                        </div>
                        <div>
                            <strong id="followerCount">0</strong>
                            <span>팔로워</span>
                        </div>
                        <div>
                            <strong id="followingCount">0</strong>
                            <span>팔로잉</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="profileBio" class="profile-bio"></div>

            <div class="profile-actions">
                <button>프로필 편집</button>
                <button>프로필 공유</button>
            </div>
        </section>

        <div class="profile-tabs">
            <div class="active">
                <i class="fa-solid fa-table-cells"></i>
            </div>
            <div>
                <i class="fa-solid fa-clapperboard"></i>
            </div>
            <div>
                <i class="fa-regular fa-user"></i>
            </div>
        </div>

        <div id="profileGrid" class="profile-grid"></div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-button active" data-screen="home" id="homeNavButton">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="nav-button">
            <i class="fa-regular fa-circle-play"></i>
        </button>
        <button class="nav-button">
            <i class="fa-regular fa-paper-plane"></i>
            <span class="notification-dot"></span>
        </button>
        <button class="nav-button">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button id="profileNavButton" class="nav-button profile-nav-button" data-screen="profile">
            <img id="bottomProfileAvatar" src="" alt="프로필">
            <span class="notification-dot"></span>
        </button>
    </nav>
</div>

<!-- 하단 브라우저 바 : N 로고만 index로 이동, 나머지 버튼은 디자인 요소 -->
<div class="browser-bar">
    <div id="naverHomeBtn" class="browser-btn browser-home" role="button" aria-label="홈으로">
        <svg width="23.3" height="23.3" viewBox="0 0 23.3 23.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="1" width="21.3" height="21.3" rx="4.5"/>
            <path d="M7.6 15.7V7.7L15.7 15.7V7.7"/>
        </svg>
    </div>
    <div class="browser-btn">
        <svg width="10.3" height="17.7" viewBox="0 0 10.3 17.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.3 1L1 8.85L9.3 16.7"/>
        </svg>
    </div>
    <div class="browser-btn disabled">
        <svg width="10.3" height="17.7" viewBox="0 0 10.3 17.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1L9.3 8.85L1 16.7"/>
        </svg>
    </div>
    <div class="browser-btn">
        <svg width="19.6" height="20.5" viewBox="0 0 19.6 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9.13" cy="9.3" r="8"/>
            <path d="M14.8 15.2L18.5 19.4"/>
        </svg>
    </div>
    <div class="browser-btn">
        <svg width="20" height="19.5" viewBox="0 0 20 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.33 11.93A8.58 8.58 0 1 1 18.4 7.17M18.4 1.67V7.17H13.67"/>
        </svg>
    </div>
    <div class="browser-btn">
        <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1H21M1 9H21"/>
        </svg>
    </div>
</div>

<div id="accountSheet" class="account-sheet">
    <div class="account-panel">
        <div class="account-title">계정 전환</div>
        <div id="accountOptions"></div>
    </div>
</div>

<div id="viewer" class="viewer">
    <div class="viewer-header">
        <i id="viewerClose" class="fa-solid fa-arrow-left"></i>
        <img id="viewerAvatar" class="avatar" alt="프로필 이미지">
        <span id="viewerUsername" class="username"></span>
    </div>
    <div class="viewer-body">
        <div class="viewer-media">
            <div id="viewerTrack" class="viewer-track"></div>
            <div id="viewerCounter" class="viewer-counter"></div>
        </div>
        <div class="viewer-actions">
            <i id="viewerLike" class="fa-regular fa-heart like-button"></i>
            <i class="fa-regular fa-comment"></i>
            <i class="fa-regular fa-paper-plane"></i>
            <i class="fa-regular fa-bookmark save"></i>
        </div>
        <div id="viewerCaption" class="viewer-caption"></div>
    </div>
</div>

<div id="storyViewer" class="story-viewer">
    <div id="storyProgressContainer" class="story-progress-container"></div>

    <div class="story-header">
        <img id="storyAvatar" class="avatar" alt="프로필 이미지">

function setupPostSlider(element, total) {
    const track = element.querySelector(".post-track");
    const counter = element.querySelector(".post-counter");

    let currentIndex = 0;
    let startX = 0;
    let currentX = 0;
    let isDragging = false;

    function dragStart(event) {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        isDragging = true;
        startX = event.clientX;
        currentX = startX;
        track.style.transition = "none";
        track.setPointerCapture(event.pointerId);
    }

    function dragMove(event) {
        if (!isDragging) return;
        currentX = event.clientX;
        const difference = currentX - startX;
        track.style.transform = `translateX(calc(${-currentIndex * 100}% + ${difference}px))`;
    }

    function dragEnd() {
        if (!isDragging) return;
        isDragging = false;
        const difference = currentX - startX;

        if (difference < -50 && currentIndex < total - 1) {
            currentIndex++;
        } else if (difference > 50 && currentIndex > 0) {
            currentIndex--;
        }

        track.style.transition = "transform 0.25s ease-out";
        track.style.transform = `translateX(${-currentIndex * 100}%)`;
        counter.textContent = `${currentIndex + 1} / ${total}`;
    }

    track.onpointerdown = dragStart;
    track.onpointermove = dragMove;
    track.onpointerup = dragEnd;
    track.onpointercancel = dragEnd;
}

function layoutStoryOverlay() {
    const naturalWidth = storyImage.naturalWidth;
    const naturalHeight = storyImage.naturalHeight;
    const boxWidth = storyImage.clientWidth;
    const boxHeight = storyImage.clientHeight;

    if (!naturalWidth || !naturalHeight || !boxWidth || !boxHeight) {
        storyOverlay.style.display = "none";
        return;
    }

    const scale = Math.min(boxWidth / naturalWidth, boxHeight / naturalHeight);
    const width = naturalWidth * scale;
    const height = naturalHeight * scale;

    storyOverlay.style.width = width + "px";
    storyOverlay.style.height = height + "px";
    storyOverlay.style.left = (storyImage.offsetLeft + (boxWidth - width) / 2) + "px";
    storyOverlay.style.top = (storyImage.offsetTop + (boxHeight - height) / 2) + "px";
    storyOverlay.style.display = "block";
}

function renderStoryOverlay(story) {
    storyOverlay.innerHTML = "";
    storyOverlay.style.display = "none";

    (story.overlays || []).forEach(item => {
        let element;

        if (item.image) {
            element = document.createElement("img");
            element.src = item.image;
            element.alt = "";
            element.draggable = false;
            element.className = "story-overlay-item story-overlay-image";
        } else {
            element = document.createElement("div");
            element.className = "story-overlay-item story-overlay-text";
            if (item.html) element.innerHTML = item.html;
            else element.textContent = item.text || "";
        }

        if (item.className) element.className += " " + item.className;
        if (item.style) element.style.cssText = item.style;

        storyOverlay.appendChild(element);
    });

    if (storyImage.complete) layoutStoryOverlay();
}

storyImage.addEventListener("load", layoutStoryOverlay);
window.addEventListener("resize", layoutStoryOverlay);

function updateStoryImage() {
    const account = accounts[currentStoryAccountIndex];
    const story = account.stories[currentStoryImageIndex];

    storyImage.src = story.image;
    renderStoryOverlay(story);
    window.scrollTo(0, 0);

    storyChatArea.innerHTML = "";
    storyInput.value = "";

    if (story.defaultMessage) {
        const sender = accounts[story.senderAccountIndex];

        appendBubble(
            story.defaultMessage,
            sender.username,
            sender.avatar
        );
    }

    const storageKey = `story_chat_${currentStoryAccountIndex}_${currentStoryImageIndex}`;
    let chatList = JSON.parse(sessionStorage.getItem(storageKey)) || [];

    chatList.forEach(message => {
        appendBubble(
            message.text,
            message.username,
            message.avatar
        );
    });

    startStoryTimer();
}

function startStoryTimer() {
    clearInterval(progressInterval);
    const fills = document.querySelectorAll(".story-progress-fill");

    fills.forEach((fill, idx) => {
        if (idx < currentStoryImageIndex) fill.style.width = "100%";
        else if (idx > currentStoryImageIndex) fill.style.width = "0%";
    });

    const currentFill = fills[currentStoryImageIndex];
    if (currentFill) currentFill.style.width = "0%";

    let startTime = Date.now();

    progressInterval = setInterval(() => {
        let elapsed = Date.now() - startTime;
        let percent = (elapsed / STORY_DURATION) * 100;

        if (percent >= 100) {
            percent = 100;
            clearInterval(progressInterval);
            goToNextStory();
        }
        if (currentFill) currentFill.style.width = percent + "%";
    }, 16);
}

function goToNextStory() {
    const account = accounts[currentStoryAccountIndex];
    if (currentStoryImageIndex < account.stories.length - 1) {
        currentStoryImageIndex++;
        updateStoryImage();
    } else {
        closeStory();
    }
}

function goToPrevStory() {
    if (currentStoryImageIndex > 0) {
        currentStoryImageIndex--;
        updateStoryImage();
    } else {
        closeStory();
    }
}

function appendBubble(text, senderUsername = null, senderAvatar = null) {
    const wrapper = document.createElement("div");
    wrapper.className = "story-bubble-wrapper";

    if (senderUsername) {
        const sender = document.createElement("div");
        sender.className = "story-bubble-sender";

        if (senderAvatar) {
            sender.innerHTML = `
                <img src="${senderAvatar}" alt="">
                <span>${senderUsername}</span>
            `;
        } else {
            sender.innerHTML = `
                <span>${senderUsername}</span>
            `;
        }

        wrapper.appendChild(sender);
    }

    const bubble = document.createElement("div");
    bubble.className = "story-bubble";
    bubble.textContent = text;

    wrapper.appendChild(bubble);
    storyChatArea.appendChild(wrapper);
}

document.getElementById("storyClose").addEventListener("click", closeStory);

storyImage.addEventListener("click", (event) => {
    const clickX = event.clientX;
    const screenWidth = window.innerWidth;

    if (clickX < screenWidth * 0.3) {
        goToPrevStory();
    } else {
        goToNextStory();
    }
});

storyInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && storyInput.value.trim() !== "") {
        const text = storyInput.value.trim();
        storyInput.value = "";

        appendBubble(
            text,
            storyUserProfile.username,
            storyUserProfile.avatar
        );

        const storageKey = `story_chat_${currentStoryAccountIndex}_${currentStoryImageIndex}`;
        let chatList = JSON.parse(sessionStorage.getItem(storageKey)) || [];

        chatList.push({
            text: text,
            username: storyUserProfile.username,
            avatar: storyUserProfile.avatar
        });

        sessionStorage.setItem(storageKey, JSON.stringify(chatList));

        storyInput.focus();
    }
});

renderStories();
renderHome();
updateProfileAvatar();
showHome();


/* 모든 인스타그램 이미지 로딩 완료 후 로딩 화면 제거 */
(async function () {
    const loadingScreen = document.getElementById("instagramLoading");
    const imageUrls = new Set();

    // 현재 화면에 생성된 이미지
    document.querySelectorAll("img").forEach(img => {
        if (img.src) imageUrls.add(img.src);
    });

    // accounts 데이터에 등록된 이미지
    function collectImages(value) {
        if (typeof value === "string") {
            if (/\.(png|jpe?g|webp|gif|svg)(?:[?#].*)?$/i.test(value)) {
                imageUrls.add(new URL(value, document.baseURI).href);
            }
        } else if (Array.isArray(value)) {
            value.forEach(collectImages);
        } else if (value && typeof value === "object") {
            Object.values(value).forEach(collectImages);
        }
    }

    collectImages(accounts);

    // 이미지가 로드되거나 실패한 경우 모두 완료로 처리
    function loadImage(url) {
        return new Promise(resolve => {
            const img = new Image();
            const finish = () => resolve();

            img.onload = finish;
            img.onerror = finish;
            img.src = url;

            if (img.complete) finish();
        });
    }

    await Promise.all([...imageUrls].map(loadImage));

    loadingScreen.classList.add("hidden");
})();

/* 뒤로 버튼 */
document.getElementById("naverHomeBtn").addEventListener("click", function () {
    if (window.parent !== window) {
        try {
            if (window.frameElement) {
                window.frameElement.classList.remove("open");
                return;
            }
        } catch (err) { /* 접근할 수 없으면 아래 방식 사용 */ }
        window.parent.postMessage({ type: "closeApp" }, "*");
        return;
    }
    // 단독으로 열린 경우: index.html로 이동
    location.href = "../index.html";
});
